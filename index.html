<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loader Library - Kho Giao Diện Loading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/favicon.png" type="image/png">
</head>
<body>
    <div class="grain-overlay"></div>
    
    <header class="header">
        <div class="header-content">
            <h1 class="title">
                <span class="title-main">LOADER</span>
                <span class="title-sub">LIBRARY</span>
            </h1>
            <p class="subtitle">Bộ sưu tập loading animations đẹp mắt và dễ sử dụng</p>
        </div>
    </header>

    <main class="container">
        <div class="gallery" id="gallery">
            <!-- Loaders will be dynamically loaded here -->
        </div>

        <!-- Modal Preview -->
        <div class="modal" id="modal">
            <div class="modal-backdrop" id="modalBackdrop"></div>
            <div class="modal-content">
                <button class="modal-close" id="modalClose">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
                
                <div class="modal-grid">
                    <div class="preview-section">
                        <div class="preview-label">PREVIEW</div>
                        <div class="preview-container" id="previewContainer">
                            <iframe id="previewFrame"></iframe>
                        </div>
                    </div>

                    <div class="code-section">
                        <div class="tabs">
                            <button class="tab active" data-tab="html">HTML</button>
                            <button class="tab" data-tab="css">CSS</button>
                            <button class="tab" data-tab="js">JS</button>
                        </div>

                        <div class="code-panels">
                            <div class="code-panel active" id="panel-html">
                                <button class="copy-btn" data-code="html">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                    </svg>
                                    Copy HTML
                                </button>
                                <pre><code id="code-html"></code></pre>
                            </div>

                            <div class="code-panel" id="panel-css">
                                <button class="copy-btn" data-code="css">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                    </svg>
                                    Copy CSS
                                </button>
                                <pre><code id="code-css"></code></pre>
                            </div>

                            <div class="code-panel" id="panel-js">
                                <button class="copy-btn" data-code="js">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                    </svg>
                                    Copy JS
                                </button>
                                <pre><code id="code-js"></code></pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
