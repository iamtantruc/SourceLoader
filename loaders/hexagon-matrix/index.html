<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexagon Matrix Loader</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="loader">
        <div class="hexagon-grid">
            <div class="hexagon-row">
                <div class="hexagon"><div class="hexagon-inner"></div></div>
                <div class="hexagon"><div class="hexagon-inner"></div></div>
                <div class="hexagon"><div class="hexagon-inner"></div></div>
            </div>
            <div class="hexagon-row offset">
                <div class="hexagon"><div class="hexagon-inner"></div></div>
                <div class="hexagon"><div class="hexagon-inner"></div></div>
                <div class="hexagon"><div class="hexagon-inner"></div></div>
                <div class="hexagon"><div class="hexagon-inner"></div></div>
            </div>
            <div class="hexagon-row">
                <div class="hexagon"><div class="hexagon-inner"></div></div>
                <div class="hexagon"><div class="hexagon-inner"></div></div>
                <div class="hexagon"><div class="hexagon-inner"></div></div>
            </div>
            <div class="hexagon-row offset">
                <div class="hexagon"><div class="hexagon-inner"></div></div>
                <div class="hexagon"><div class="hexagon-inner"></div></div>
                <div class="hexagon"><div class="hexagon-inner"></div></div>
                <div class="hexagon"><div class="hexagon-inner"></div></div>
            </div>
            <div class="hexagon-row">
                <div class="hexagon"><div class="hexagon-inner"></div></div>
                <div class="hexagon"><div class="hexagon-inner"></div></div>
                <div class="hexagon"><div class="hexagon-inner"></div></div>
            </div>
        </div>
    </div>
</body>
</html>
